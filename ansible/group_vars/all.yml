ansible_user: "ansible"

services:
  - { name: nn, user: hdfs }
  - { name: sn, user: hdfs }
  - { name: dn, user: hdfs }
  - { name: rm, user: yarn }
  - { name: nm, user: yarn }
  - { name: jhs, user: mapred }
  - { name: host, user: hadoop }
  - { name: hive, user: hive }
  - { name: HTTP, user: hadoop }
  - { name: kafka, user: kafka }

service_users:
  hadoop:
    name: "hadoop"
    group: "hadoop"
    state: "present"
  hdfs:
    name: "hdfs"
    group: "hadoop"
    state: "present"
  yarn:
    name: "yarn"
    group: "hadoop"
    state: "present"
  mapred:
    name: "mapred"
    group: "hadoop"
    state: "present"
  hive:
    name: "hive"
    group: "hadoop"
    state: "present"
  kafka:
    name: "kafka"
    group: "hadoop"
    state: "present"
  spark:
    name: "spark"
    group: "hadoop"
    state: "present"

personal_users:
  - { name: "bernhard", password: "bernhard", group: "bernhard", state: "present" }
  - { name: "testuser", password: "testuser", group: "testuser", state: "present" }

java:
  jdk_8:
    file: "amazon-corretto-8.492.09.2-linux-x64.tar.gz"
    home_path: "/opt/jdk-8"
  jdk_17:
    file: "amazon-corretto-17.0.19.10.1-linux-x64.tar.gz"
    home_path: "/opt/jdk-17"

apt_packages:
  - "acl"
  - "python3-pip"
  - "python3.10-venv"

kerberos:
  realm: "MYREALM.DEV"
  password: "ch4ng3M3!"
  keytab_path: "/etc/security/keytab"

hadoop:
  cluster_id: "hadoop_1"
  binaries_archive: "hadoop-3.3.6.tar.gz"
  home_path: "/opt/hadoop"
  path: "/opt/hadoop-3.3.6"
  dirs:
    logs:
      path: "/var/log/hadoop/"
      owner: "hdfs"
      group: "hadoop"
      mode: "0771"
    user_logs:
      path: "/var/log/hadoop/userlogs"
      owner: "yarn"
      group: "hadoop"
      mode: "1777"
    namenode:
      path: "/srv/hadoop/hdfs/name"
      owner: "hdfs"
      group: "hadoop"
      mode: "0700"
    datanode:
      path: "/srv/hadoop/hdfs/data"
      owner: "hdfs"
      group: "hadoop"
      mode: "0700"

tez:
  home_path: "/opt/tez"

ssl:
  local_certs_dir: "certs"
  keystore_file: "/etc/security/hadoop/keystore.jks"
  keystore_password: "bigdata"
  truststore_file: "/etc/security/hadoop/truststore.jks"
  truststore_password: "bigdata"

hdfs:
  hadoop_dirs:
    root_dir:
      path: "/"
      owner: hdfs
      group: hadoop
      mode: "755"
    user_dir:
      path: "/user"
      owner: hdfs
      group: hadoop
      mode: "755"
    tmp_dir:
      path: "/tmp"
      owner: hdfs
      group: hadoop
      mode: "1777"
    yarn_remote_app_log_dir:
      path: "/tmp/logs"
      owner: yarn
      group: hadoop
      mode: "1777"
    yarn_mapreduce_am_staging_dir:
      path: "/tmp/hadoop-yarn/staging"
      owner: yarn
      group: hadoop
      mode: "1777"
    mapreduce_jobhistory_intermediate_done_dir:
      path: "/tmp/hadoop-yarn/staging/history/done_intermediate"
      owner: mapred
      group: hadoop
      mode: "1777"
    mapreduce_jobhistory_done_dir:
      path: "/tmp/hadoop-yarn/staging/history/done"
      owner: mapred
      group: hadoop
      mode: "750"
  spark_dirs:
    spark_jar_archive_dir:
      path: "/apps/spark"
      owner: spark
      group: hadoop
      mode: "755"
  hive_dirs:
    hive_tmp:
      path: "/tmp/hive"
      owner: hive
      group: hadoop
      mode: "1777"
    hive_managed_dir:
      path: "/warehouse/managed"
      owner: hive
      group: hive
      mode: "777"
    hive_external_dir:
      path: "/warehouse/external"
      owner: hive
      group: hive
      mode: "777"
