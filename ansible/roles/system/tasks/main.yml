- name: "Create Service User"
  tags: ["system", "system_users"]
  loop: "{{ service_users | dict2items }}"
  vars:
    user_name: "{{ item.value.name }}"
    user_group: "{{ item.value.group }}"
    generate_ssh_key: false
  ansible.builtin.include_tasks:
    file: "create_user.yml"
    apply:
      tags: ["system", "system_users"]

- name: "Create Personal User"
  tags: ["system", "system_users"]
  loop: "{{ personal_users | selectattr('state', 'equalto', 'present') | list }}"
  vars:
    user_name: "{{ item.name }}"
    user_group: "{{ item.group }}"
    generate_ssh_key: true
  ansible.builtin.include_tasks:
    file: "create_user.yml"
    apply:
      tags: ["system", "system_users"]

- name: "Delete Personal User"
  loop: "{{ personal_users | selectattr('state', 'equalto', 'absent') | list }}"
  tags: ["system", "system_users"]
  vars:
    user_name: "{{ item.name }}"
    user_group: "{{ item.group }}"
  ansible.builtin.include_tasks:
    file: "delete_user.yml"
    apply:
      tags: ["system", "system_users"]

