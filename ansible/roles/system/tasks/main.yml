- name: Update Apt Package Cache
  tags: ["system", "system_packages"]
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: "Install Packages"
  tags: ["system", "system_packages"]
  become: true
  loop: "{{ apt_packages }}"
  ansible.builtin.apt:
    name: "{{ item }}"
    state: "present"
