- name: "Install JDK 8"
  tags: ["system", "system_jdk"]
  vars:
    jdk_binaries_location: "jdk/{{ ansible_facts['architecture'] }}"
    jdk_binaries_file: "{{ java.jdk_8.file }}"
    jdk_home_path: "{{ java.jdk_8.home_path }}"
  ansible.builtin.import_tasks: "install_jdk.yml"

- name: "Install JDK 17"
  tags: ["system", "system_jdk"]
  vars:
    jdk_binaries_location: "jdk/{{ ansible_facts['architecture'] }}"
    jdk_binaries_file: "{{ java.jdk_17.file }}"
    jdk_home_path: "{{ java.jdk_17.home_path }}"
  ansible.builtin.import_tasks: "install_jdk.yml"

