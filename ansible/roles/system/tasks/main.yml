- name: "Generate /etc/hosts File"
  tags: ["system", "system_hosts_file"]
  become: true
  ansible.builtin.template:
    src: "hosts.j2"
    dest: "/etc/hosts"
    mode: "755"

- name: "Disable /etc/hosts update in /etc/cloud/cloud.cfg"
  tags: ["system", "system_hosts_file"]
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/cloud/cloud.cfg"
    search_string: "- update_etc_hosts"
    line: "# - update_etc_hosts"

