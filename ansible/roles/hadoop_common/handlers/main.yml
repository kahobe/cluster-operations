- name: "Restart Namenode Service"
  become: true
  ansible.builtin.service:
    name: "hdfs-namenode.service"
    state: "restarted"
  when:
    - inventory_hostname in groups["hdfs_namenode"]
  listen:
    - "Start Hadoop Services"

- name: "Restart Datanode Service"
  become: true
  ansible.builtin.service:
    name: "hdfs-datanode.service"
    state: "restarted"
  when:
    - inventory_hostname in groups["hdfs_datanode"]
  listen:
    - "Start Hadoop Services"

- name: "Start YARN Resource Manager Service"
  become: true
  ansible.builtin.service:
    name: "yarn-resourcemanager.service"
    state: "restarted"
  when:
    - inventory_hostname in groups["yarn_resource_manager"]
  listen:
    - "Start Hadoop Services"

- name: "Start YARN Node Manager Service"
  become: true
  ansible.builtin.service:
    name: "yarn-nodemanager.service"
    state: "restarted"
  when:
    - inventory_hostname in groups["yarn_node_manager"]
  listen:
    - "Start Hadoop Services"

- name: "Start YARN History Server Service"
  become: true
  ansible.builtin.service:
    name: "yarn-historyserver.service"
    state: "restarted"
  when:
    - inventory_hostname in groups["yarn_job_history_server"]
  listen:
    - "Start Hadoop Services"

