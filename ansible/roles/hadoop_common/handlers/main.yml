- name: "Stop YARN Node Manager Service"
  become: true
  ansible.builtin.service:
    name: "yarn-nodemanager.service"
    state: "stopped"
  when:
    - inventory_hostname in groups["yarn_node_manager"]
  listen:
    - "Stop Hadoop Services"

- name: "Stop YARN History Server Service"
  become: true
  ansible.builtin.service:
    name: "yarn-historyserver.service"
    state: "stopped"
  when:
    - inventory_hostname in groups["yarn_job_history_server"]
  listen:
    - "Stop Hadoop Services"
