- name: "Stop Namenode Service"
  become: true
  ansible.builtin.service:
    name: "hdfs-namenode.service"
    state: "stopped"
  when:
    - inventory_hostname in groups["hdfs_namenode"]
  listen:
    - "Stop Hadoop Services"

- name: "Stop Datanode Service"
  become: true
  ansible.builtin.service:
    name: "hdfs-datanode.service"
