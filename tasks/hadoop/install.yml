# Copy and Extract Hadoop to remote
- name: Copy Hadoop tarball to remote hosts
  ansible.builtin.copy:
    src: "{{ filename }}"
    dest: "/tmp/{{ filename }}"

- name: Extract Hadoop tarball
  ansible.builtin.unarchive:
    src: "/tmp/{{ filename }}"
    dest: "/opt/"
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    mode: "u=rwx,g=rwx,o=r"
    remote_src: yes

- name: Create a symbolic link
  ansible.builtin.file:
    src: /opt/hadoop-{{ hadoop_version }}
    dest: /opt/hadoop
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    state: link

- name: Creates logs directory
  ansible.builtin.file:
    path: /opt/hadoop/logs
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    mode: "u=rwx,g=rwx,o=r"
    state: directory

# Setting up Directories
- name: Create Data Directory
  ansible.builtin.file:
    path: /srv/hadoop/hdfs/data
    owner: "{{ hdfs_user }}"
    group: "{{ hadoop_user }}"
    state: directory
    mode: "0755"

- name: Create NameNode Directory
  ansible.builtin.file:
    path: /srv/hadoop/hdfs/name
    owner: "{{ hdfs_user }}"
    group: "{{ hadoop_user }}"
    state: directory
    mode: "0755"


