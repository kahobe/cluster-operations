- name: Start NameNode Service
  tags:
    - hdfs
  ansible.builtin.service:
    name: hdfs-namenode.service
    state: started
  when:
    - inventory_hostname in groups["controllers"]

- name: Start DataNode Service
  tags:
    - hdfs
  ansible.builtin.service:
    name: hdfs-datanode.service
    state: started
  when:
    - inventory_hostname in groups["workernodes"]

- name: Start YARN ResourceManager Service
  tags:
    - yarn
  ansible.builtin.service:
    name: yarn-resourcemanager.service
    state: started
  when:
    - inventory_hostname in groups["controllers"]

- name: Start YARN NodeManager Service
  tags:
    - yarn
  ansible.builtin.service:
    name: yarn-nodemanager.service
    state: started
  when:
    - inventory_hostname in groups["workernodes"]

- name: Start YARN HistoryServer Service
  tags:
    - yarn
  ansible.builtin.service:
    name: yarn-historyserver.service
    state: started
  when:
    - inventory_hostname in groups["controllers"]
