# Copy and Extract Hadoop to remote
- name: Create  directory
  ansible.builtin.file:
    path: /etc/security/hadoop/
    owner: "{{ service_users.hadoop.name }}"
    group: "{{ service_users.hadoop.group }}"
    mode: "u=rwx,g=rwx,o=r"
    state: directory

- name: Copy Keystore
  ansible.builtin.copy:
    src: "certs/{{ inventory_hostname }}-keystore.jks"
    dest: "{{ ssl.keystore_file }}"
    mode: "640"
    owner: "{{ service_users.hadoop.name }}"
    group: "{{ service_users.hadoop.group }}"

- name: Copy Trusstore
  ansible.builtin.copy:
    src: "certs/truststore.jks"
    dest: "{{ ssl.truststore_file }}"
    mode: "640"
    owner: "{{ service_users.hadoop.name }}"
    group: "{{ service_users.hadoop.group }}"
