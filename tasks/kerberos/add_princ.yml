- name: Add Kerberos principal
  ansible.builtin.expect:
    command: kadmin.local -q "addprinc {{ user }}/{{ instance }}@KAHOVEC.DEV"
    responses:
      "Enter password for principal .*: ": "{{ password }}"
      "Re-enter password for principal .*: ": "{{ password }}"
  become: yes
  register: result
  run_once: true

- name: Print output
  debug:
    var: result.stdout_lines
