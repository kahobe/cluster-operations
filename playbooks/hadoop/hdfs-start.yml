---
- name: Start Hadoop DataNodes
  hosts: controllers, workernodes
  become: true
  become_user: hadoop

  tasks:
    - name: Check HADOOP_HOME
      shell: echo $HADOOP_HOME
      register: hadoop_home
      failed_when: hadoop_home.stdout == ""
      tags:
         - nn
         - dn

    - name: Start NameNode
      command: "$HADOOP_HOME/bin/hdfs --daemon start namenode"
      register: namenode_format_result
      when:
        - inventory_hostname in groups["controllers"]
      tags:
         - nn

    - name: Display result
      debug:
        var: namenode_format_result
      tags:
         - nn
         
    - name: Start DataNode
      command: "$HADOOP_HOME/bin/hdfs --daemon start datanode"
      register: datanode_start_result
      when:
        - inventory_hostname in groups["workernodes"]
      tags:
         - dn

    - name: Display result
      debug:
        var: datanode_start_result
      tags:
         - dn

