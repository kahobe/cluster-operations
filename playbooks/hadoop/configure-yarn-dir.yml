---
- name: Configure YARN dit
  hosts: controllers
  become: true
  become_user: hadoop

  tasks:
    - name: Create HDFS /warehouse dir
      shell: $HADOOP_HOME/bin/hdfs dfs -mkdir -p /tmp/hadoop-yarn
      become: true
      become_user: hadoop
      ignore_errors: true
      tags:
        - configuration

    - name: Set HDFS permissions for /warehouse dir
      shell: $HADOOP_HOME/bin/hdfs dfs -chmod -R 777 /tmp/hadoop-yarn
      become: true
      become_user: hadoop
      tags:
        - configuration