---
- name: Install and Configure Hive
  hosts: controllers
  become: true
  vars:
    hive_user: "hive"
    hive_version: "3.1.3"  # Change this to the desired Hadoop version
    java_package: "openjdk-8-jdk"  # Change this if you prefer a different Java version
    filename: "apache-hive-{{ hive_version }}-bin.tar.gz"
    jdbc_file: "mysql-connector-j-8.2.0.jar"

  tasks:
    - name: Ensure MySQL Service for Metastore is running
      ansible.builtin.systemd_service:
        name: mysql.service
        state: started
        enabled: true

    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Install Java
      apt:
        name: "{{ java_package }}"
        state: present

    - name: Copy Hive tarball to remote hosts
      ansible.builtin.copy:
        src: "{{ filename }}"
        dest: "/tmp/{{ filename }}"

    - name: Extract Hadoop tarball
      ansible.builtin.unarchive:
        src: "/tmp/{{ filename }}"
        dest: "/opt/"
        owner: "{{ hive_user }}"
        group: "{{ hive_user }}"
        remote_src: yes

    - name: Create a symbolic link
      ansible.builtin.file:
        src: /opt/apache-hive-{{ hive_version }}-bin
        dest: /opt/hive
        owner: "{{ hive_user }}"
        group: "{{ hive_user }}"
        state: link

    - name: Set Hadoop environment variables
      lineinfile:
        path: /etc/environment
        line: 'export HIVE_HOME=/opt/hive'
      become: true

    - name: Add hive to PATH for all Users
      copy:
        content: "export PATH=$PATH:$HIVE_HOME/bin"
        dest: "/etc/profile.d/hive_path.sh"
      become: true

    - name: Configure Hadoop hivemetastore-site.xml
      template:
        src: hivemetastore-site.xml.j2
        dest: /opt/hive/conf/hivemetastore-site.xml
        owner: "{{ hive_user }}"
        group: "{{ hive_user }}"
      tags:
         - configuration

    - name: Copy file
      ansible.builtin.copy:
        src: /opt/hive/conf/hive-env.sh.template
        dest: /opt/hive/conf/hive-env.sh
        remote_src: yes
      tags:
         - configuration    

    - name: Set HADOOP_HOME in hive-env.sh
      lineinfile:
        path: /opt/hive/conf/hive-env.sh
        search_string: '# export HADOOP_HOME'
        line: 'export HADOOP_HOME=/opt/hadoop/'
      tags:
         - configuration

    - name: Copy MySQL JDBC Driver
      ansible.builtin.copy:
        src: "{{ jdbc_file }}"
        dest: "/opt/hive/lib/{{ jdbc_file }}"
      tags:
         - configuration

    - name: Initialize Metastore Schema
      shell: $HIVE_HOME/bin/schematool --dbType mysql --initSchema
      become: true
      become_user: hive

