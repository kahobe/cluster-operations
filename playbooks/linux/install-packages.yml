
- name: Install required packages
  hosts: controllers, workernodes
  become: true

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes

    # ACL package is required for ansible to become another user.
    # other wise ruinning in following error
    # "Failed to set permissions on the temporary files Ansible needs to create when becoming an unprivileged user ... "
    - name: Install acl package
      apt:
        name: acl
        state: present

    - name: Install pip
      apt:
        name: python3-pip
        state: present
      when:
        - inventory_hostname in groups["controllers"]

    - name: Install venv
      apt:
        name: "python{{ python_version }}-venv"
        state: present
      when:
        - inventory_hostname in groups["controllers"]

    - name: Install Java
      apt:
        name: "{{ java_package }}"
        state: present

    - name: Set JAVA_HOME
      lineinfile:
        path: /etc/environment
        state: present
        regexp: '^JAVA_HOME'
        line: 'JAVA_HOME={{ java_home_path }}'
        